spring:
  application:
    name: fxwallet
  datasource:
    url: jdbc:h2:mem:fxwallet-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: test-secret-key-for-integration-tests-must-be-at-least-256-bits-long
    expiration-ms: 86400000
  external:
    rates-api-url: http://localhost:9999/test-rates
    api-key: test-key
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

server:
  port: 0

logging:
  level:
    com.fxwallet: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
