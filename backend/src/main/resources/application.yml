spring:
  application:
    name: fxwallet
  datasource:
    url: jdbc:mysql://localhost:3306/fxwallet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-string-for-production-use}
    expiration-ms: 86400000
  external:
    rates-api-url: https://api.exchangerate-api.com/v4/latest/USD
    api-key: ${EXCHANGE_RATE_API_KEY:}

logging:
  level:
    com.fxwallet: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
